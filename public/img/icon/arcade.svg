<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="arcadeBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="arcadeScreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <filter id="arcadeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Container arredondado com sombra -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#arcadeBgGrad)" filter="url(#arcadeShadow)" />

  <!-- Gabinete Arcade -->
  <path d="M20 13H44C45.6569 13 47 14.3431 47 16V46C47 48.2091 45.2091 50 43 50H21C18.7909 50 17 48.2091 17 46V16C17 14.3431 18.3431 13 20 13Z" fill="#18181b" opacity="0.9" />

  <!-- Faixa de Letreiro Superior -->
  <rect x="21" y="15" width="22" height="5" rx="1.5" fill="#f43f5e" />
  <rect x="23" y="16.5" width="18" height="2" rx="1" fill="#fef08a" />

  <!-- Tela da Máquina Arcade -->
  <rect x="20" y="22" width="24" height="15" rx="2" fill="url(#arcadeScreenGrad)" stroke="#38bdf8" stroke-width="1" />

  <!-- Gráficos pixelados na tela (jogos) -->
  <!-- Coroa de dama / Dama -->
  <circle cx="27" cy="27" r="2.5" fill="#f43f5e" />
  <circle cx="37" cy="32" r="2.5" fill="#38bdf8" />
  <circle cx="32" cy="29" r="1.5" fill="#facc15" />

  <!-- Mesa de Controles / Joystick -->
  <path d="M18 40H46L44 47H20L18 40Z" fill="#27272a" />

  <!-- Alavanca do Joystick (vermelha) -->
  <line x1="25" y1="44" x2="25" y2="41" stroke="#a1a1aa" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="25" cy="40.5" r="2.5" fill="#ef4444" />

  <!-- Botões de Ação Arcade -->
  <circle cx="33" cy="43.5" r="1.8" fill="#eab308" />
  <circle cx="38" cy="42" r="1.8" fill="#10b981" />
  <circle cx="42" cy="43.5" r="1.8" fill="#3b82f6" />
</svg>
