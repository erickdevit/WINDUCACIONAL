name: Build Typing Desktop App (Tauri)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies
        working-directory: typing-desktop
        run: npm install

      - name: build tauri app
        working-directory: typing-desktop
        run: npx tauri build

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WINDUCACIONAL-Digitacao-Windows
          path: typing-desktop/src-tauri/target/release/bundle/nsis/*.exe

      - name: create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: typing-desktop/src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
