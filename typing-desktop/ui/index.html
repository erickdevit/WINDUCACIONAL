<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Setup - WINDUCACIONAL Digitação</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .container {
      background-color: #1e1e1e;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    h1 {
      margin-top: 0;
      color: #ffcc02;
    }
    p {
      color: #cccccc;
      margin-bottom: 30px;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid #333;
      border-radius: 6px;
      background-color: #2a2a2a;
      color: #fff;
      font-size: 16px;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: #ffcc02;
    }
    button {
      background-color: #ffcc02;
      color: #000;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
      width: 100%;
    }
    button:hover {
      background-color: #e6b800;
    }
  </style>
</head>
<body>
  <div class="container" id="setupContainer" style="display: none;">
    <h1>Configuração Inicial</h1>
    <p>Informe o endereço do servidor WINDUCACIONAL (IP ou Domínio).</p>
    <input type="text" id="serverUrl" placeholder="Ex: https://meuservidor.com.br" />
    <button onclick="saveAndStart()">Iniciar Aplicativo</button>
  </div>

  <script>
    const savedUrl = localStorage.getItem('server_url');
    if (savedUrl) {
      loadUrl(savedUrl);
    } else {
      document.getElementById('setupContainer').style.display = 'block';
    }

    function saveAndStart() {
      let url = document.getElementById('serverUrl').value.trim();
      if (!url) {
        alert("Por favor, insira um endereço válido.");
        return;
      }
      
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'http://' + url;
      }
      
      if (url.endsWith('/')) {
        url = url.slice(0, -1);
      }
      
      localStorage.setItem('server_url', url);
      loadUrl(url);
    }

    function loadUrl(baseUrl) {
      const targetUrl = baseUrl + '/digitar';
      window.location.replace(targetUrl);
    }
  </script>
</body>
</html>
